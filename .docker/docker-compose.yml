services:
  app:
    env_file:
      - .env
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: filament_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-filament_app}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - .:/var/www/html
      - ./.docker/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    networks:
      - filament_network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: filament_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - filament_network
    depends_on:
      - app

  postgres:
    image: postgres:15
    container_name: filament_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-filament_app}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - filament_network

  redis:
    image: redis:7-alpine
    container_name: filament_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./.docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - filament_network

volumes:
  postgres_data:
  redis_data:

networks:
  filament_network:
    driver: bridge 