services:
  app:
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
    container_name: filament_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
      - ./php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    networks:
      - filament_network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: filament_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - filament_network
    depends_on:
      - app

  postgres:
    image: postgres:15
    container_name: filament_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: filament_app
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: password
      POSTGRES_ROOT_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - filament_network

  redis:
    image: redis:7-alpine
    container_name: filament_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - filament_network

volumes:
  postgres_data:
  redis_data:

networks:
  filament_network:
    driver: bridge 